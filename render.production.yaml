# Clinical staging preparation only. Applying this Blueprint creates PAID resources; approve the bill first.
services:
  - type: web
    name: psikolog-web
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start
    healthCheckPath: /api/health
    disk:
      name: private-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: psikolog-db
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: APP_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: DEMO_MODE
        value: "false"
      - key: PAYMENT_PROVIDER
        value: disabled
      - key: VIDEO_PROVIDER
        value: disabled
      - key: PRODUCTION_LEGAL_APPROVED
        value: "false"
      - key: PRIVATE_STORAGE_PATH
        value: /var/data/private
      - key: PERSISTENT_STORAGE_CONFIRMED
        value: "true"
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
  - type: cron
    name: psikolog-reminders
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    branch: main
    autoDeployTrigger: checksPass
    schedule: "* * * * *"
    buildCommand: "true"
    startCommand: node scripts/scheduled-jobs.mjs
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: APP_URL
        fromService:
          type: web
          name: psikolog-web
          envVarKey: APP_URL
      - key: JOB_SECRET
        fromService:
          type: web
          name: psikolog-web
          envVarKey: JOB_SECRET
databases:
  - name: psikolog-db
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    databaseName: psikolog
    user: psikolog_owner
    diskSizeGB: 5
    ipAllowList: []
