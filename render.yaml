# Default deployment: temporary, fictional review only. Both resources use the Free compute plan.
# Free PostgreSQL expires after 30 days. Never upgrade without owner approval.
services:
  - type: web
    name: psikolog-review
    runtime: node
    region: frankfurt
    plan: free
    branch: review-20261125
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: psikolog-review-db
          property: connectionString
      - key: DATABASE_POOL_MAX
        value: "3"
      # start-production derives the canonical origin from RENDER_EXTERNAL_URL.
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: JOB_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: MOCK_WEBHOOK_SECRET
        generateValue: true
      - key: DEMO_CLIENT_PASSWORD
        generateValue: true
      - key: DEMO_ADMIN_PASSWORD
        generateValue: true
      - key: REVIEW_MODE
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: PRODUCTION_LEGAL_APPROVED
        value: "false"
      - key: PAYMENT_PROVIDER
        value: mock
      - key: VIDEO_PROVIDER
        value: mock
      - key: EMAIL_PROVIDER
        value: preview
      - key: FILE_STORAGE_PROVIDER
        value: database
databases:
  - name: psikolog-review-db
    region: frankfurt
    plan: free
    postgresMajorVersion: "17"
    databaseName: durak_review_20261125abcd
    user: review_owner
    ipAllowList: []
